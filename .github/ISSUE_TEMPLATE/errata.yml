name: Erratum
description: Report a mistake in one of the books — a wrong formula, statement, solution, figure or typo.
title: "[Erratum] "
labels: ["erratum"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you! Errata are the most valuable contribution the books receive —
        fixes usually ship in the next release, within days.
  - type: dropdown
    id: book
    attributes:
      label: Book
      options:
        - "1 — Markets I: The Ecosystem and Exchange-Traded Markets"
        - "2 — Markets II: Rates, FX and Credit"
        - "3 — Markets III: Commodities, Energy and Crypto"
        - "4 — Quantitative Methods"
        - "5 — Derivatives and Volatility"
        - "6 — Rates, Credit, XVA and Risk"
        - "7 — Research Craft"
        - "8 — Strategies I: Equities and Futures"
        - "9 — Strategies II: Volatility, Relative Value, Macro and the Bank Desks"
        - "10 — Microstructure and Execution"
        - "11 — Market Making and HFT"
        - "12 — Machine Learning for Markets"
        - "13 — Low-Latency Software"
        - "14 — Networks, Hardware and Trading Infrastructure"
        - "15 — Research, Data and Risk Platforms"
        - "16 — The Desk and the Firm"
        - "17 — The Industry: Firms, Roles and Careers"
        - "18 — Interviews I: Maths, Probability and Speed"
        - "19 — Interviews II: Markets, Trading Games and the Final Round"
        - "20 — Interviews III: Code"
    validations:
      required: true
  - type: dropdown
    id: language
    attributes:
      label: Edition
      options:
        - English
        - French
      default: 0
    validations:
      required: true
  - type: input
    id: location
    attributes:
      label: Where
      description: >
        Chapter and page, plus the version from the title page (e.g. v0.0.7) —
        or the URL of the online chapter.
      placeholder: "Chapter 12, page 143, v0.0.7"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What is wrong
      description: Quote the current text or formula, and say what you believe it should be.
    validations:
      required: true
