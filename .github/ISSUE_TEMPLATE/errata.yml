name: Erratum
description: Report a mistake in one of the books — a wrong formula, number, solution, figure, code listing, source or typo.
title: "[Erratum] "
labels: ["erratum"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you! Errata are the most valuable contribution the books receive —
        fixes usually ship in the next release, within days.
  - type: dropdown
    id: book
    attributes:
      label: Book
      options:
        - "1 — Markets I"
        - "2 — Markets II: Rates, FX and Credit"
        - "3 — Markets III: Commodities, Energy and Crypto"
        - "4 — Quantitative Methods"
        - "5 — Derivatives and Volatility"
        - "6 — Rates, Credit, XVA and Risk"
        - "7 — Research Craft"
        - "8 — Strategies I: Equities and Futures"
        - "9 — Strategies II: Volatility, Relative Value, Macro and the Bank Desks"
        - "10 — Microstructure and Execution"
        - "11 — Market Making and HFT"
        - "12 — Machine Learning for Markets"
        - "13 — Low-Latency Software"
    validations:
      required: true
  - type: input
    id: location
    attributes:
      label: Where
      description: >
        Chapter and page, plus the version from the title page (e.g. v0.0.4) — or the path of the code file.
      placeholder: "Chapter 4 (The Greeks), page 44, v0.0.4"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What is wrong
      description: Quote the current text, formula or number, and say what you believe it should be (with a source if it is a fact about markets).
    validations:
      required: true
