name: ci
# Tags and manual runs only (Actions tab "Run workflow", or gh workflow run ci.yml --ref main).
on:
  push:
    tags: ['*']
  workflow_dispatch: {}
jobs:
  code:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      # One job per code root: a small pytest process each, and a failure names its book.
      matrix:
        slug: [markets-1, markets-2, markets-3, methods, derivatives, rates-credit-risk, research,
               strategies-1, strategies-2, microstructure, hft, ml, low-latency, firm]
    env:
      OPENBLAS_NUM_THREADS: 1
      OMP_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v5
      # Same Python and packages as the machine that wrote figdata/ (requirements.txt):
      # Python 3.12 rounds sum() differently and moved chart digits.
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: 1.97.1, components: clippy }
      - run: make venv
      - run: tools/test_code.sh ${{ matrix.slug }}
      - run: tools/figdata.sh ${{ matrix.slug }} && tools/figdata_diff.sh
  book:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y latexmk texlive-latex-extra texlive-science texlive-pictures texlive-fonts-recommended lmodern
      - run: latexmk
      - run: tools/gates.sh log
