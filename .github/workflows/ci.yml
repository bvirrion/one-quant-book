name: ci
on: [push, pull_request]
jobs:
  code:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy }
      - run: make venv
      - run: make test-code
      - run: make figdata && git diff --exit-code figdata/
  book:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y latexmk texlive-latex-extra texlive-science texlive-pictures texlive-fonts-recommended lmodern
      - run: latexmk
      - run: tools/gates.sh log
