name: ci
# Tags and manual runs only (Actions tab "Run workflow", or gh workflow run ci.yml --ref main).
# A v* tag also publishes a release with the PDFs (job `release`); a manual run never does.
on:
  push:
    tags: ['*']
  workflow_dispatch: {}
jobs:
  code:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      # One job per code root: a small pytest process each, and a failure names its book.
      matrix:
        slug: [markets-1, markets-2, markets-3, methods, derivatives, rates-credit-risk, research,
               strategies-1, strategies-2, microstructure, hft, ml, low-latency, firm]
    env:
      OPENBLAS_NUM_THREADS: 1
      OMP_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v5
      # Same Python and packages as the machine that wrote the book's numbers (requirements.txt).
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: 1.97.1, components: clippy }
      - run: make venv
      # Which processor and kernels this runner has: a numeric failure is read against it.
      - run: |
          lscpu | grep -E 'Model name|^CPU\(s\)|Flags' | cut -c1-300
          grep -E 'MemTotal' /proc/meminfo; cat /sys/kernel/mm/transparent_hugepage/enabled
          OPENBLAS_CORETYPE=Haswell ATEN_CPU_CAPABILITY=avx2 .venv/bin/python -c "import numpy, torch; numpy.show_runtime(); print('torch', torch.backends.cpu.get_cpu_capability())"
      # Fast set: the `reference` tests (exact printed digits) and the chart regeneration run only on the
      # machine that wrote them (make reproduce); the chart CSVs' format is still checked here.
      - run: OQB_TESTS=fast tools/test_code.sh ${{ matrix.slug }}
  book:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0            # the tag's date, for the title pages
      - name: Stamp the tag's date and name (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          DATE=$(git for-each-ref --format='%(creatordate:short)' "refs/tags/${GITHUB_REF_NAME}")
          printf '\\renewcommand{\\bookdate}{%s}\n'    "$DATE"            >  version.tex
          printf '\\renewcommand{\\bookversion}{%s}\n' "$GITHUB_REF_NAME" >> version.tex
      - run: sudo apt-get update && sudo apt-get install -y latexmk texlive-latex-extra texlive-science texlive-pictures texlive-fonts-recommended lmodern
      - run: latexmk
      - run: tools/gates.sh log
      - uses: actions/upload-artifact@v4
        with:
          name: pdfs
          path: build/one_quant_book_*.pdf
          if-no-files-found: error
          retention-days: 7
  # On a v* tag, once the code and the books are green: a GitHub release with every book's PDF, like the math and
  # physics series. Each PDF is attached twice: versioned, and under its plain name, which makes
  # releases/latest/download/<name>.pdf a permanent link to the newest edition.
  release:
    needs: [code, book]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write             # to create the release and upload its assets
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pdfs
          path: build
      - name: Name the PDFs with the version
        run: |
          for pdf in build/one_quant_book_*.pdf; do
            slug="$(basename "$pdf" .pdf)"
            mv "$pdf" "${slug}_${GITHUB_REF_NAME}.pdf"
            ln "${slug}_${GITHUB_REF_NAME}.pdf" "${slug}.pdf"
          done
          ls -la one_quant_book_*.pdf
      - uses: softprops/action-gh-release@v2
        with:
          files: one_quant_book_*.pdf
          generate_release_notes: true
          body: |
            The **One Quant Book** series compiled at `${{ github.ref_name }}`, in English.
            Books 1 to 13 are written: Markets I, II and III, Quantitative Methods, Derivatives and Volatility,
            Rates, Credit, XVA and Risk, Research Craft, Strategies I and II, Microstructure and Execution,
            Market Making and HFT, Machine Learning for Markets, and Low-Latency Software. Books 14 to 18 are
            in preparation.

            - **Download**: pick the PDF for your book below. Files without a version suffix are stable names:
              `releases/latest/download/<name>.pdf` always fetches the newest edition.
            - Found a mistake? [Open an issue](https://github.com/${{ github.repository }}/issues/new).
