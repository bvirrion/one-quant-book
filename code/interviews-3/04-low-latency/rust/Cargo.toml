[package]
name = "iv33"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[workspace]

# The printed programs teach one point each and keep what the point needs: loops that index on purpose (the
# bounds-check comparison), a plain vec!, and a bare new().
[lints.clippy]
needless_range_loop = "allow"
useless_vec = "allow"
new_without_default = "allow"
